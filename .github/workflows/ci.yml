name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore day-3/QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Build
        run: dotnet build day-3/QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore

      - name: Test
        run: dotnet test day-3/QuotesApi.Tests/QuotesApi.Tests.csproj --no-build
